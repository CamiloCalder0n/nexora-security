x-php: &php
  build: docker/php
  image: nexora-php
  volumes:
    - ./backend:/var/www/backend
  depends_on:
    pgsql:
      condition: service_healthy
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"

  worker:
    <<: *php
    # Primero la cola telegram: los avisos no esperan detrás de una ráfaga de correlaciones (HU21).
    command: php artisan queue:work --queue=telegram,default --tries=3 --backoff=5
    # Si Redis o la BD se caen, queue:work termina con error: Docker lo vuelve a levantar.
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
