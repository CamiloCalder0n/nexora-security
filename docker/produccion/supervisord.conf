; Los tres procesos del backend en un contenedor (en Render los workers aparte son pagos).
; Si uno se cae, supervisord lo vuelve a levantar; todo el log va a la salida del contenedor.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=php artisan serve --host=0.0.0.0 --port=%(ENV_PORT)s
directory=/var/www/backend
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
; Primero la cola telegram: los avisos no esperan detrás de una ráfaga de correlaciones (HU21).
; --sleep=3 (el de Laravel) con la cola vacía: el aviso llega en menos de 10 s.
command=php artisan queue:work --queue=telegram,default --tries=3 --backoff=5 --max-time=3600
directory=/var/www/backend
autorestart=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/backend
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:salir-si-falla]
command=/usr/local/bin/salir-si-falla
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
